<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spiele Server Bewerbung</title>

<link rel="icon" href="logo.png">

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;

    font-family: Arial, Helvetica, sans-serif;

    background: #0f172a;
    color: #f8fafc;

    transition: 0.3s;
}


/* =========================
   NAVIGATION
========================= */

nav {
    position: sticky;
    top: 0;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 15px 30px;

    background: rgba(15, 23, 42, 0.92);

    backdrop-filter: blur(12px);

    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 8px;
}

.nav-links a {
    color: inherit;

    text-decoration: none;

    padding: 10px 15px;

    border-radius: 10px;

    transition: 0.2s;
}

.nav-links a:hover,
.nav-links a.active {
    background: rgba(255,255,255,0.1);
}


/* =========================
   THEME
========================= */

.theme-button {
    border: none;

    background: rgba(255,255,255,0.1);

    color: inherit;

    padding: 10px 13px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 18px;
}


/* =========================
   HERO
========================= */

.hero {
    min-height: 380px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 70px 20px;

    background:
        radial-gradient(
            circle at top,
            #2563eb,
            #1e293b 40%,
            #0f172a 75%
        );

    position: relative;

    overflow: hidden;
}

.hero::before {
    content: "";

    position: absolute;

    width: 500px;
    height: 500px;

    background: #3b82f6;

    border-radius: 50%;

    filter: blur(150px);

    opacity: 0.22;

    top: -250px;

    left: 50%;

    transform: translateX(-50%);
}

.hero-content {
    position: relative;

    z-index: 2;

    max-width: 800px;
}

.hero h1 {
    font-size: clamp(45px, 8vw, 70px);

    margin: 0 0 20px;

    font-weight: 800;
}

.hero h1 span {
    color: #60a5fa;
}

.hero p {
    font-size: 20px;

    color: #cbd5e1;

    line-height: 1.7;

    margin: 0;
}


/* =========================
   FORMULAR
========================= */

.container {
    max-width: 850px;

    margin: auto;

    padding: 70px 20px;
}

.form-box {
    background: rgba(30, 41, 59, 0.92);

    padding: 35px;

    border-radius: 20px;

    border: 1px solid rgba(255,255,255,0.08);

    box-shadow:
        0 15px 40px rgba(0,0,0,0.25);

    backdrop-filter: blur(8px);
}

.form-box h2 {
    margin-top: 0;

    font-size: 30px;
}

.form-box p {
    color: #cbd5e1;

    line-height: 1.7;
}


/* =========================
   FORM FELDER
========================= */

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;

    margin-bottom: 8px;

    font-weight: bold;
}

.form-group input,
.form-group select,
.form-group textarea {

    width: 100%;

    padding: 14px;

    border: 1px solid rgba(255,255,255,0.1);

    border-radius: 10px;

    background: #0f172a;

    color: white;

    font-size: 16px;

    outline: none;

    transition: 0.2s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {

    border-color: #3b82f6;

    box-shadow:
        0 0 0 3px rgba(59,130,246,0.15);
}

.form-group textarea {

    min-height: 140px;

    resize: vertical;
}


/* =========================
   BUTTON
========================= */

.submit-button {

    width: 100%;

    border: none;

    background: #2563eb;

    color: white;

    padding: 16px;

    border-radius: 12px;

    cursor: pointer;

    font-size: 18px;

    font-weight: bold;

    transition: 0.25s;
}

.submit-button:hover {

    background: #3b82f6;

    transform: translateY(-3px);

    box-shadow:
        0 12px 30px rgba(37,99,235,0.35);
}

.submit-button:disabled {

    opacity: 0.6;

    cursor: not-allowed;

    transform: none;

}


/* =========================
   MELDUNGEN
========================= */

.message {

    display: none;

    margin-top: 20px;

    padding: 15px;

    border-radius: 10px;

    text-align: center;

    font-weight: bold;
}

.message.success {

    display: block;

    background: rgba(34,197,94,0.15);

    color: #4ade80;
}

.message.error {

    display: block;

    background: rgba(239,68,68,0.15);

    color: #f87171;
}


/* =========================
   FOOTER
========================= */

footer {

    text-align: center;

    padding: 30px;

    color: #94a3b8;
}


/* =========================
   LIGHT MODE
========================= */

body.light {

    background: #f1f5f9;

    color: #0f172a;
}

body.light nav {

    background: rgba(255,255,255,0.92);

    border-bottom: 1px solid #e2e8f0;
}

body.light .hero {

    background:
        radial-gradient(
            circle at top,
            #93c5fd,
            #e0f2fe 45%,
            #f1f5f9 75%
        );
}

body.light .hero p {

    color: #475569;
}

body.light .form-box {

    background: rgba(255,255,255,0.92);

    border: 1px solid #e2e8f0;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.08);
}

body.light .form-box p {

    color: #475569;
}

body.light .form-group input,
body.light .form-group select,
body.light .form-group textarea {

    background: white;

    color: #0f172a;

    border: 1px solid #cbd5e1;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 750px) {

    nav {

        padding: 12px 15px;

        flex-wrap: wrap;
    }

    .logo {

        width: 100%;

        text-align: center;

        margin-bottom: 5px;
    }

    .nav-links {

        width: 100%;

        justify-content: center;

        flex-wrap: wrap;
    }

    .nav-links a {

        font-size: 14px;

        padding: 8px 10px;
    }

    .hero {

        min-height: 330px;

        padding: 60px 20px;
    }

    .hero h1 {

        font-size: 45px;
    }

    .hero p {

        font-size: 17px;
    }

    .container {

        padding: 50px 15px;
    }

    .form-box {

        padding: 25px;
    }

}

</style>

</head>

<body>


<!-- =========================
     NAVIGATION
========================= -->

<nav>

<div class="logo">
🎮 Spiele Server
</div>


<div class="nav-links">

<a href="index.html">
🏠 Startseite
</a>

<a href="spiele.html">
🎮 Spiele
</a>

<a href="news.html">
📣 News
</a>

<a href="team.html">
👥 Team
</a>

<a href="bewerbung.html" class="active">
📝 Bewerbung
</a>

<a
href="https://discord.gg/VDNRRT3hnj"
target="_blank"
rel="noopener noreferrer">

💬 Discord

</a>

<button
class="theme-button"
onclick="toggleTheme()"
id="themeButton">

🌙

</button>

</div>

</nav>


<!-- =========================
     HERO
========================= -->

<section class="hero">

<div class="hero-content">

<h1>
Team <span>Bewerbung</span>
</h1>

<p>
Du möchtest Teil unseres Teams werden?
Dann fülle einfach die Bewerbung aus.
</p>

</div>

</section>


<!-- =========================
     FORMULAR
========================= -->

<main class="container">

<div class="form-box">

<h2>
📝 Deine Bewerbung
</h2>

<p>
Fülle alle Felder ehrlich aus.
Deine Bewerbung wird anschließend an unser Team gesendet.
</p>


<form id="applicationForm">


<div class="form-group">

<label for="discord">
👤 Discord-Name
</label>

<input
type="text"
id="discord"
placeholder="z.B. KiaBruno"
required>

</div>


<div class="form-group">

<label for="age">
🎂 Alter
</label>

<input
type="number"
id="age"
min="10"
max="99"
placeholder="Dein Alter"
required>

</div>


<div class="form-group">

<label for="position">
🛡️ Bewerbung für
</label>

<select id="position" required>

<option value="">
Bitte auswählen
</option>

<option value="Supporter">
🛟 Supporter
</option>

<option value="Helfer">
🤝 Helfer
</option>

<option value="Developer">
💻 Developer
</option>

<option value="Ersteller">
🛠️ Ersteller
</option>

<option value="Content Creator">
🎥 Content Creator
</option>

</select>

</div>


<div class="form-group">

<label for="games">
🎮 Welche Spiele spielst du?
</label>

<input
type="text"
id="games"
placeholder="z.B. Minecraft, Fortnite..."
required>

</div>


<div class="form-group">

<label for="activity">
⏰ Wie aktiv bist du?
</label>

<input
type="text"
id="activity"
placeholder="z.B. täglich 2-3 Stunden"
required>

</div>


<div class="form-group">

<label for="reason">
💬 Warum möchtest du ins Team?
</label>

<textarea
id="reason"
placeholder="Erzähle uns etwas über dich und warum du ins Team möchtest..."
required></textarea>

</div>


<button
type="submit"
class="submit-button"
id="submitButton">

📤 Bewerbung absenden

</button>


<div
class="message"
id="message">
</div>


</form>

</div>

</main>


<footer>

© Spiele Server 2026

</footer>


<script>


const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1539652761938043002/UmESNsYZmogTIAp3uMB4cMsPyDweXXS3Fta9LZhOSWFmtw4uACKL1yqx0576-0QRq-1d";


/* =========================
   BEWERBUNG SENDEN
========================= */

document
.getElementById("applicationForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const discord =
        document.getElementById("discord").value.trim();

    const age =
        document.getElementById("age").value.trim();

    const position =
        document.getElementById("position").value;

    const games =
        document.getElementById("games").value.trim();

    const activity =
        document.getElementById("activity").value.trim();

    const reason =
        document.getElementById("reason").value.trim();


    const button =
        document.getElementById("submitButton");

    const message =
        document.getElementById("message");


    button.disabled = true;

    button.textContent = "⏳ Wird gesendet...";

    message.className = "message";

    message.textContent = "";


    const data = {

        username: "Spiele Server – Bewerbungen",

        embeds: [

            {

                title: "📋 Neue Team-Bewerbung",

                color: 2505830,

                fields: [

                    {
                        name: "👤 Discord",
                        value: discord,
                        inline: true
                    },

                    {
                        name: "🎂 Alter",
                        value: age,
                        inline: true
                    },

                    {
                        name: "🛡️ Bewerbung für",
                        value: position,
                        inline: false
                    },

                    {
                        name: "🎮 Spiele",
                        value: games,
                        inline: false
                    },

                    {
                        name: "⏰ Aktivität",
                        value: activity,
                        inline: false
                    },

                    {
                        name: "💬 Warum möchtest du ins Team?",
                        value: reason,
                        inline: false
                    }

                ],

                footer: {

                    text: "Spiele Server – Bewerbungen"

                },

                timestamp:
                    new Date().toISOString()

            }

        ]

    };


    try {

        const response =
            await fetch(
                DISCORD_WEBHOOK,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(data)

                }
            );


        if (!response.ok) {

            throw new Error(
                "Webhook Fehler"
            );

        }


        message.className =
            "message success";

        message.textContent =
            "✅ Deine Bewerbung wurde erfolgreich gesendet!";


        document
        .getElementById("applicationForm")
        .reset();


    } catch (error) {

        console.error(error);


        message.className =
            "message error";

        message.textContent =
            "❌ Die Bewerbung konnte nicht gesendet werden. Bitte versuche es später erneut.";

    }


    button.disabled = false;

    button.textContent =
        "📤 Bewerbung absenden";

});


/* =========================
   THEME
========================= */

function toggleTheme() {

    document.body.classList.toggle("light");

    const isLight =
        document.body.classList.contains("light");


    localStorage.setItem(

        "spieleServerTheme",

        isLight
            ? "light"
            : "dark"

    );


    updateThemeButton();

}


function updateThemeButton() {

    const button =
        document.getElementById("themeButton");


    if (
        document.body.classList.contains("light")
    ) {

        button.textContent = "☀️";

    } else {

        button.textContent = "🌙";

    }

}


/* =========================
   THEME LADEN
========================= */

window.addEventListener(
    "load",
    function() {

        const savedTheme =
            localStorage.getItem(
                "spieleServerTheme"
            );


        if (
            savedTheme === "light"
        ) {

            document.body
            .classList
            .add("light");

        }


        updateThemeButton();

    }
);

</script>

</body>

</html>
